name: 📊 盘中选股扫描 + 盘后日报

on:
  # 盘中扫描：10:00 / 11:00 / 13:30 / 14:30（可买入时间）
  schedule:
    - cron: '0 2 * * 1-5'   # UTC 02:00 = 北京时间 10:00
    - cron: '0 3 * * 1-5'   # UTC 03:00 = 北京时间 11:00
    - cron: '30 5 * * 1-5'  # UTC 05:30 = 北京时间 13:30
    - cron: '30 6 * * 1-5'  # UTC 06:30 = 北京时间 14:30 ⭐ 过夜持股法窗口
  
  # 盘后日报：15:30（生成当日报告）
    - cron: '30 7 * * 1-5'  # UTC 07:30 = 北京时间 15:30
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      scan_time:
        description: '扫描时间 (10:00/11:00/13:30/14:30/15:30)'
        required: false
        default: '14:30'
      push_wechat:
        description: '推送到微信 (true/false)'
        required: false
        default: 'false'

jobs:
  screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install akshare pandas numpy requests
      
      - name: Run daily scan
        id: scan
        run: |
          cd scripts
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            python3 daily_report_generator.py --mock-data --push
          else
            python3 daily_report_generator.py --push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Push report to repository
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "📊 Daily report: $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐛 每日扫描失败: ${new Date().toISOString().split('T')[0]}`,
              body: `工作流运行失败，请检查日志。\n\n[查看运行详情](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated']
            })
