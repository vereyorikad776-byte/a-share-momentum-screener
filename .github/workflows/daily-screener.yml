name: 📊 Daily Stock Screener

on:
  # 每天北京时间 15:30 运行（收盘后）
  schedule:
    - cron: '30 7 * * 1-5'  # UTC 07:30 = 北京时间 15:30
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      mock:
        description: '使用模拟数据测试'
        required: false
        default: 'false'

jobs:
  screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install akshare pandas numpy requests
      
      - name: Run daily scan
        id: scan
        run: |
          cd scripts
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            python3 daily_report_generator.py --mock-data --push
          else
            python3 daily_report_generator.py --push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Push report to repository
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "📊 Daily report: $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐛 每日扫描失败: ${new Date().toISOString().split('T')[0]}`,
              body: `工作流运行失败，请检查日志。\n\n[查看运行详情](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated']
            })
